sites:
  jiaoyimao:
    enabled: true
    urls:
      - https://www.jiaoyimao.com/jg1008016/f2161571-c2161572/o110/?rId=107&searchCondition=%7B%22filter_low_quality%22%3A%7B%22conditionList%22%3A%5B%221%22%5D%7D%7D&enforcePlat=2&newPage=true
    max_pages: 3
    filters:
      price_min: 1000        # 价格下限（元，含）；null = 不限
      price_max: 4000        # 价格上限（元，含）；null = 不限
      platforms: ["安卓"]    # 只要安卓，不要苹果/iOS；空 = 全部
      servers: []
      include_keywords: []  # 匹配 title + description + sellPoints
      exclude_keywords: []
      require_account_transfer: true  # 只要详情页「账号转移 = 是」的商品
notify:
  channels: [feishu]        # 可选 feishu / email，可同时开启
  batch_size: 10
  include_images: false     # false = 不加载/不显示商品图片；true = 恢复内联图片
  include_safe_report: false  # false = 通知里不显示「安全报告」；详情页仍会抓取用于筛选
alerts:
  consecutive_failures_before_alert: 3
  min_alert_interval_minutes: 180
bootstrap:
  notify_on_first_run: true # 首次运行只发「监控已启动，当前 N 条」，不逐条推送
